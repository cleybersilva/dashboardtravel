<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B34"/>
      <stop offset="1" stop-color="#0A1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B9832F"/>
      <stop offset="1" stop-color="#F4D28A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- trajetoria de voo, solida e grossa para legibilidade em 16px -->
  <path d="M10 44 Q 28 50 33 30 Q 37 13 53 17"
        fill="none" stroke="url(#gold)" stroke-width="4.6" stroke-linecap="round"/>

  <!-- aviao simplificado (triangulo com asas), ponta do trajeto -->
  <g transform="translate(53,17) rotate(-28)">
    <path d="M0 -9 L3 3 L11 6 L11 9.5 L3 7.5 L1.5 13 L4.5 14.5 L4.5 17 L0 15.5 L-4.5 17 L-4.5 14.5 L-1.5 13 L-3 7.5 L-11 9.5 L-11 6 L-3 3 Z"
          fill="url(#gold)"/>
  </g>

  <!-- ponto de origem -->
  <circle cx="10" cy="44" r="3.4" fill="#5FB2E0"/>
</svg>
